[project]
name = "economic-complexity"
version = "0.1.0"
description = "Economic complexity (ECI, PCI) from BACI trade data, and a levelised cost of methanol (LCOM) chain on the BOA LCOE"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "openpyxl",  # Excel output of economic_complexity
    "pandas",
    "scipy",
]

[project.optional-dependencies]
lcom = [
    "baseload-optimisation-atlas",
    "netcdf4>=1.6.0",
    "xarray>=2025.3.1",
]

[project.scripts]
economic-complexity = "economic_complexity.cli:main"
lcom = "lcom.cli:main"

[tool.uv.sources]
baseload-optimisation-atlas = { git = "https://github.com/systemiqofficial/baseload-optimisation-atlas", rev = "aca4e056889567f1b7dbeefa85ccd009d147d3bb" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/economic_complexity", "src/lcom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8.0",
]
